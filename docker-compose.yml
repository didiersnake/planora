services:
  planora-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: planora-app
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.planora-app.rule=Host(`planora.didierdjakoua.site`)"
      - "traefik.http.routers.planora-app.entrypoints=web,websecure"
      - "traefik.http.routers.planora-app.tls=true"
      - "traefik.http.services.planora-app.loadbalancer.server.port=3000"
    networks:
      - traefik_proxy
      - planora_network

networks:
  traefik_proxy:
    external: true
  planora_network:
    external: true
